version: "3.9"

services:
  # ────────────────────────────────────────
  # CouchDB
  # ────────────────────────────────────────
  couchdb:
    image: couchdb:3.3
    container_name: pantrypal_couchdb
    restart: unless-stopped
    environment:
      COUCHDB_USER: admin
      COUCHDB_PASSWORD: admin
    ports:
      - "5984:5984"
    volumes:
      - couchdb_data:/opt/couchdb/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5984/_up"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ────────────────────────────────────────
  # Django Backend
  # ────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pantrypal_backend
    restart: unless-stopped
    environment:
      DJANGO_SECRET_KEY: change-this-in-production
      DEBUG: "False"
      COUCHDB_URL: http://couchdb:5984
      COUCHDB_USER: admin
      COUCHDB_PASSWORD: admin
      COUCHDB_DB: pantrypal
    ports:
      - "8000:8000"
    volumes:
      - ./backend/media:/app/media
    depends_on:
      couchdb:
        condition: service_healthy

  # ────────────────────────────────────────
  # React Frontend
  # ────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pantrypal_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  couchdb_data:
